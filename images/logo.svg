<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 370">
  <!-- Chimney (behind roof) -->
  <rect x="192" y="44" width="24" height="73" fill="none" stroke="#c9a030" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chimney smoke sparks -->
  <circle cx="199" cy="34" r="4" fill="#c9a030"/>
  <circle cx="209" cy="25" r="3.5" fill="#c9a030"/>
  <circle cx="202" cy="16" r="2.5" fill="#c9a030"/>
  <circle cx="215" cy="18" r="2" fill="#c9a030"/>
  <circle cx="218" cy="29" r="2" fill="#c9a030"/>

  <!-- Roof -->
  <polyline points="150,22 268,112 32,112" fill="none" stroke="#c9a030" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- House walls -->
  <rect x="44" y="111" width="212" height="152" fill="none" stroke="#c9a030" stroke-width="7" stroke-linejoin="round"/>

  <!-- Left window -->
  <rect x="60" y="140" width="38" height="34" fill="none" stroke="#c9a030" stroke-width="5" stroke-linejoin="round"/>
  <line x1="79" y1="140" x2="79" y2="174" stroke="#c9a030" stroke-width="4"/>
  <line x1="60" y1="157" x2="98" y2="157" stroke="#c9a030" stroke-width="4"/>

  <!-- Right window -->
  <rect x="202" y="140" width="38" height="34" fill="none" stroke="#c9a030" stroke-width="5" stroke-linejoin="round"/>
  <line x1="221" y1="140" x2="221" y2="174" stroke="#c9a030" stroke-width="4"/>
  <line x1="202" y1="157" x2="240" y2="157" stroke="#c9a030" stroke-width="4"/>

  <!-- Spray bottle body -->
  <rect x="116" y="158" width="58" height="94" rx="7" fill="none" stroke="#c9a030" stroke-width="6"/>
  <!-- Bottle head/neck -->
  <rect x="116" y="135" width="34" height="26" rx="5" fill="none" stroke="#c9a030" stroke-width="5.5"/>
  <!-- Nozzle -->
  <line x1="116" y1="142" x2="95" y2="142" stroke="#c9a030" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Trigger -->
  <path d="M150 138 Q168 133 166 158" fill="none" stroke="#c9a030" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Spray dots -->
  <circle cx="84" cy="135" r="3.5" fill="#c9a030"/>
  <circle cx="77" cy="127" r="3" fill="#c9a030"/>
  <circle cx="86" cy="120" r="2.5" fill="#c9a030"/>
  <circle cx="76" cy="113" r="2" fill="#c9a030"/>

  <!-- Text: RENATA'S -->
  <text x="150" y="304" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="700" letter-spacing="4"
        fill="#c9a030">RENATA'S</text>
  <!-- Text: CLEANING -->
  <text x="150" y="350" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="700" letter-spacing="4"
        fill="#c9a030">CLEANING</text>
</svg>
